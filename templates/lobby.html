<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ session.csrf }}">
  <title>Space Rocks · 游戏大厅</title>
  <link rel="stylesheet" href="/static/lobby.css">
  <script defer src="/static/lobby.js"></script>
</head>
<body>
  <main>
    <h1>Space Rocks</h1>
    <p class="intro">小行星游戏大厅</p>
    <a style="color:#9be7de" href="/static/guide.html">学习指南 · 跟踪一次注册请求</a>
    {% if username %}
    <section>
      <h2>{{ username }} 的飞船</h2>
      <p>← → 旋转，↑ 加速，空格射击，Esc 退出。</p>
      <button data-api="/api/play">开始桌面游戏</button>
      <button class="secondary" data-api="/api/logout">退出登录</button>
    </section>
    <section>
      <h2>最近 10 局</h2>
      <button class="secondary" id="refresh">刷新战绩</button>
      <ul id="results"></ul>
    </section>
    {% else %}
    <section>
      <h2>玩家登录</h2>
      <form id="account">
        <label>用户名<input name="username" autocomplete="username" required maxlength="30"></label>
        <label>密码<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
        <button type="submit" value="/api/login">登录</button>
        <button type="submit" value="/api/register" class="secondary">注册新账号</button>
      </form>
    </section>
    {% endif %}
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
